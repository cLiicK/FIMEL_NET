<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{{titulo_documento}}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        @page { size: letter; margin: 14mm 16mm; }

        body {
            font-family: Arial, sans-serif;
            background: #fff;
            color: #1a2a3a;
            font-size: 12.5px;
            line-height: 1.5;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
            padding: 32px 40px;
        }

        /* ── HEADER ─────────────────────────────── */
        /* Se evita flexbox (igual que receta/orden) para que el resultado sea
           el mismo si algún día se genera como PDF con iText pdfHTML. */
        .header { overflow: hidden; }
        .header-logo { float: left; height: 48px; }
        .header-logo img {
            max-height: 48px;
            max-width: 170px;
            object-fit: contain;
            vertical-align: middle;
        }
        .header-right {
            float: right;
            text-align: right;
            font-size: 11px;
            color: #888;
            padding-top: 14px;
        }
        .divider-salmon {
            height: 3px;
            background: linear-gradient(to right, #F89B9B, #f5c6c6);
            margin: 12px 0 18px;
            border-radius: 2px;
        }

        h1 {
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 18px;
            line-height: 1.35;
        }

        /* ── DECLARACIÓN ─────────────────────────── */
        .declaracion { margin-bottom: 14px; line-height: 2.1; }
        .campo {
            display: inline-block;
            min-width: 120px;
            border-bottom: 1px solid #555;
            padding: 0 4px;
            font-weight: bold;
            text-align: center;
            line-height: 1.3;
        }
        .campo.largo { min-width: 300px; }
        .campo.corto { min-width: 90px; }

        ol.items { padding-left: 22px; margin-bottom: 14px; }
        ol.items > li { margin-bottom: 5px; text-align: justify; padding-left: 4px; }
        ul.riesgos { list-style: none; margin: 4px 0 2px 6px; }
        ul.riesgos li { position: relative; padding-left: 14px; margin-bottom: 2px; }
        ul.riesgos li:before { content: "-"; position: absolute; left: 0; }

        .observaciones { margin: 10px 0 0; }
        .observaciones .lbl { font-weight: bold; }
        .observaciones .texto {
            border-bottom: 1px solid #555;
            min-height: 20px;
            padding: 0 4px;
            white-space: pre-wrap;
        }
        .observaciones .linea { border-bottom: 1px solid #555; height: 22px; }

        /* ── FIRMAS ──────────────────────────────── */
        table.firmas {
            width: 100%;
            border-collapse: separate;
            border-spacing: 18px 0;
            margin-top: 46px;
            table-layout: fixed;
            page-break-inside: avoid;
        }
        table.firmas td { vertical-align: top; text-align: center; }
        .firma-espacio { height: 64px; position: relative; }
        .firma-img {
            max-height: 60px;
            max-width: 180px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
        .firma-linea {
            border-top: 1px solid #333;
            padding-top: 6px;
            font-size: 11.5px;
            font-weight: bold;
        }
        .firma-detalle { font-size: 10.5px; color: #555; min-height: 15px; }
        .firma-rut-blanco {
            font-size: 10.5px;
            color: #555;
            text-align: left;
            margin-top: 6px;
        }

        .powered {
            text-align: center;
            margin-top: 28px;
            font-size: 9px;
            color: #ccc;
            letter-spacing: 1px;
        }

        @media print {
            body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .page { padding: 0; max-width: none; }
        }
    </style>
</head>
<body>
<div class="page">

    <div class="header">
        <div class="header-logo">
            <img src="{{logo_url}}" alt="Logo" onerror="this.style.display='none'">
        </div>
        <div class="header-right">{{institucion}}</div>
    </div>
    <div class="divider-salmon"></div>

    <h1>{{titulo_documento}}</h1>

    <p class="declaracion">
        Yo <span class="campo largo">{{paciente}}</span>
        RUT <span class="campo">{{rut_doc}}</span>
        con domicilio en <span class="campo largo">{{domicilio}}</span>
        como {{rol}}, con fecha <span class="campo corto">{{fecha}}</span>, declaro:
    </p>

    <ol class="items">
        {{items}}
    </ol>

    {{observaciones_section}}

    <table class="firmas">
        <tr>
            {{firmas}}
        </tr>
    </table>

    <div class="powered">FIMEL · Sistema de Gestión Médica</div>
</div>

<script>
    window.onafterprint = function () { window.close(); };
    window.onload = function () { window.print(); };
</script>
</body>
</html>
